aid: reindeer-ai
name: Reindeer AI
description: >-
  Reindeer AI is an enterprise agentic AI platform that automates back-office
  business operations across finance, banking, insurance, supply chain,
  procurement, legal compliance, and global business services. Founded in 2024
  with offices in New York and Tel Aviv, Reindeer deploys custom AI agents that
  learn from operational workflows using its Fast Track Training approach
  (functional models in roughly two weeks from a small number of samples), with
  human-in-the-loop escalation, continuous learning, and Model Reality Grounding
  safeguards against hallucination. It ships 200+ pre-trained skills and 200+
  out-of-the-box integrations into systems such as SAP, Oracle, NetSuite,
  Workday, ServiceNow, and Salesforce, is model-agnostic (Claude, GPT, Gemini,
  Bedrock, DeepSeek, GLM), and emphasizes customer data ownership and enterprise
  security (ISO 27001, SOC 2 Type 2, GDPR, HIPAA, CCPA). Reindeer is backed by
  Lightspeed Venture Partners, TEAM8, and Vesey Ventures. Reindeer does not
  publish a public developer API, OpenAPI, SDKs, or a developer portal; the
  product is delivered as an enterprise engagement, so this profile captures
  company identity and security posture rather than an API surface.
